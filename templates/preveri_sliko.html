{% extends "base.html" %}
{% block title %}Preveri sliko{% endblock %}

{% block content %}
<div class="container my-4" style="max-width:1000px">
  <h1 class="mb-3">Preveri sliko</h1>
  <p class="text-muted">Najprej vpiši <strong>geslo</strong>. Iskanje pokaže vse njegove opise in preveri slike v novem ter starem VUS-u. Opis je neobvezen dodatni filter.</p>
  <div class="card mb-4"><div class="card-body">
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label" for="geslo">Geslo</label><input id="geslo" class="form-control" placeholder="npr. TRAORE"></div>
      <div class="col-md-8"><label class="form-label" for="opis">Opis – dodatni filter</label><input id="opis" class="form-control" placeholder="npr. slikar 1936 ali pisatelj John"></div>
    </div>
    <button class="btn btn-primary mt-3" type="button" onclick="preveriSliko()">Preveri</button>
  </div></div>

  <div id="status" class="mb-3" aria-live="polite"></div>
  <div id="rezultati" class="row g-3"></div>

  <div class="card mt-4" id="uploadCard" style="display:none"><div class="card-body">
    <h5>Naloži manjkajočo sliko</h5>
    <label class="form-label">Ime datoteke</label>
    <div class="input-group mb-3"><input id="predlagano_ime" class="form-control"><button class="btn btn-outline-secondary" type="button" onclick="kopirajIme()">Kopiraj</button></div>
    <form onsubmit="uploadSliko(event)"><input id="file_input" class="form-control mb-3" type="file" accept="image/*"><button class="btn btn-success">Naloži sliko</button></form>
  </div></div>
</div>

<script>
const esc = value => String(value || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function pripraviUpload(name) {
  document.getElementById('predlagano_ime').value = name || '';
  document.getElementById('uploadCard').style.display = 'block';
  document.getElementById('uploadCard').scrollIntoView({behavior: 'smooth', block: 'center'});
}

async function preveriSliko() {
  const geslo = document.getElementById('geslo').value.trim();
  const opis = document.getElementById('opis').value.trim();
  if (!geslo && !opis) { alert('Vnesi geslo ali opis.'); return; }
  const status = document.getElementById('status');
  const results = document.getElementById('rezultati');
  status.textContent = 'Iščem …'; results.innerHTML = '';
  try {
    const response = await fetch('/api/preveri_sliko', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({geslo, opis})});
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'Napaka pri iskanju.');
    const matches = data.matches || [];
    status.innerHTML = matches.length ? `Najdenih zapisov: <strong>${matches.length}</strong>.` : 'Za ta vnos ni zapisov.';
    results.innerHTML = matches.map(item => `
      <div class="col-md-6"><div class="card h-100"><div class="card-body">
        <div class="fw-bold">${esc(item.geslo)}</div><div class="small mb-2">${esc(item.opis)}</div>
        ${item.exists ? `<span class="badge bg-success">Slika obstaja: ${esc(item.source)}</span><div class="mt-2"><img class="img-fluid rounded border" style="max-height:220px" src="${encodeURI(item.preview_url)}?_=${Date.now()}" alt="Predogled"></div>` : '<span class="badge bg-danger">Slike ni</span>'}
        <div class="mt-3"><button class="btn btn-sm btn-outline-primary" type="button" onclick='pripraviUpload(${JSON.stringify(item.suggested_filename || '')})'>Uporabi ime za sliko</button></div>
      </div></div></div>`).join('');
  } catch (error) { status.innerHTML = `<span class="text-danger">${esc(error.message)}</span>`; }
}

async function uploadSliko(event) {
  event.preventDefault();
  const file = document.getElementById('file_input').files[0];
  const filename = document.getElementById('predlagano_ime').value.trim();
  if (!file || !filename) { alert('Izberi sliko in ime datoteke.'); return; }
  const form = new FormData(); form.append('file', file); form.append('filename', filename);
  const response = await fetch('/api/upload_sliko', {method:'POST', body:form});
  const data = await response.json();
  if (!response.ok || !data.ok) { alert(data.error || 'Nalaganje ni uspelo.'); return; }
  alert('Slika je naložena.'); preveriSliko();
}

function kopirajIme() { navigator.clipboard.writeText(document.getElementById('predlagano_ime').value); }
</script>
{% endblock %}
